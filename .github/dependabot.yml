version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Major versions are planned migrations (see the roadmap), not routine
    # bumps; security fixes still arrive as Dependabot security updates.
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      # One weekly PR for all compatible updates.
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
