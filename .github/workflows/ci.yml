name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Block on critical advisories in production dependencies. Next 15's
      # bundled build-time postcss has a high advisory fixed only in Next 16.
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      # Includes MongoDB concurrency tests on an isolated mongodb-memory-server.
      - run: npm test
      - run: npm run build

  e2e:
    # Browser tests download Chromium and a MongoDB binary; keep them off PRs.
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The e2e server runs `next start` against an existing production build.
      - run: npm run build
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
